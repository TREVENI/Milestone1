[pytest]
testpaths = tests
python_files = test_*.py

# --- Automatic test run logging ---
# Every pytest run appends to logs/pytest_run.log (UTF-8, not UTF-16)
log_file            = logs/pytest_run.log
log_file_level      = INFO
log_file_format     = %(asctime)s  %(levelname)-8s  %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Always run verbose + short traceback
addopts = -v --tb=short
